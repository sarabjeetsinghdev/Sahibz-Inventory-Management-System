name: sahibz_inventory
description: SahibZ Inventory Management System - Professional ERP-grade inventory management platform
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.3.1

  # Routing
  go_router: ^17.3.0

  # Local Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.3

  # PDF Generation
  pdf: ^3.11.0
  printing: ^5.12.0

  # Excel
  excel: ^4.0.1
  syncfusion_flutter_xlsio: ^29.2.11

  # File Operations
  share_plus: ^13.2.0
  open_file: ^4.0.0
  open_file_web: ^1.1.0
  web: ^1.1.1
  file_picker: ^12.0.0-beta.7

  # Charts
  fl_chart: ^1.2.0

  # Barcode & QR
  barcode: ^2.2.9
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0

  # Localization
  easy_localization: ^3.0.7

  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  flutter_slidable: ^4.0.3
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^5.1.1
  flutter_typeahead: ^6.0.0
  dropdown_search: ^7.0.0
  flutter_multi_formatter: ^2.11.0
  mask_text_input_formatter: ^2.9.0

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5
  logger: ^2.4.0
  intl_utils: ^2.8.10
  collection: ^1.18.0
  rxdart: ^0.28.0
  permission_handler: ^12.0.3
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0
  connectivity_plus: ^7.2.0
  url_launcher: ^6.2.5
  archive: ^3.6.1

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0

  # Background Tasks
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.0.1

  # Crypto
  encrypt: ^5.0.3
  pointycastle: ^3.8.0

  # Internationalization
  intl: 0.20.2
  google_fonts: ^8.1.0

  # Rename app
  rename_app: ^1.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/fonts/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21